<body>
<nav class="navbar">
    <div class="nav-brand">
        <a href="/index.html">William Kindell</a>
    </div>

    <button class="nav-toggle" id="nav-toggle">☰</button>

    <ul class="nav-links" id="nav-links">
        <li><a href="/index.html">Home</a></li>

        <li><a href="/contact/contact.html">Contact</a></li>

        <li><button id="theme-toggle" class="theme-btn">Theme</button></li>
    </ul>
</nav>
<header data-aos="fade-down">
    <h1>Contact Me</h1>
    <h3>Get in touch for engineering collaborations, embedded systems work, or technical questions</h3>
</header>

<section data-aos="fade-up">
    <h2>Send a Message</h2>
    <p>Fill out the form below and I’ll receive your message directly via email.</p>

    <form action="https://formsubmit.co/2da7e2c6706784915c5dfa69c63c2dfc" method="POST" class="contact-form">

        <!-- FormSubmit settings -->
        <input type="hidden" name="_subject" value="New message from your website">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <label>First Name</label>
        <input type="text" name="first-name" required>

        <label>Last Name</label>
        <input type="text" name="last-name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Message</label>
        <textarea name="message" rows="6" required></textarea>

        <button type="submit" class="theme-btn">Send Message</button>
    </form>
</section>

<footer>
    © 2026 William Kindell
</footer>

</body>
